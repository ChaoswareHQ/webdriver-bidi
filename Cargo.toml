[package]
name = "bidi-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["AzzoDude"]
description = "Generated Rust types and commands for the W3C WebDriver BiDi protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AzzoDude/bidi-protocol"
readme = "README.md"
keywords = ["webdriver", "bidi", "browser", "automation", "protocol"]
categories = ["development-tools", "web-programming"]
include = [
    "src/**",
    "scripts/**",
    "tests/**",
    "all.cddl",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

# Standalone workspace: published to crates.io independently of Xcelerate.
[workspace]
members = ["macros"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
empty_line_after_doc_comments = "allow"
doc_lazy_continuation = "allow"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bidi-protocol-macros = { version = "0.1.0", path = "macros" }

[features]
default = ["full"]
full = [
    "browser",
    "browsing_context",
    "emulation",
    "input",
    "log",
    "network",
    "script",
    "session",
    "storage",
    "web_extension",
]
browser = []
browsing_context = []
emulation = []
input = []
log = []
network = []
script = []
session = []
storage = []
web_extension = []
