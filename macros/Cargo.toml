[package]
name = "bidi-protocol-macros"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["AzzoDude"]
description = "Derive macros for bidi-protocol (builder, command and event generation)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AzzoDude/bidi-protocol"
keywords = ["webdriver", "bidi", "protocol", "macros"]
categories = ["development-tools", "web-programming"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
